name: Profile checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q scripts tests demo/email-claim demo/claim-combinations
      - name: Fetch exact house snapshots
        run: python scripts/fetch_locked_houses.py --output-dir "$RUNNER_TEMP/space-snapshots"
      - name: Verify canonical assembled map
        run: python scripts/build_space.py --source-dir "$RUNNER_TEMP/space-snapshots" --check
      - name: Verify generated human map
        run: python scripts/render_space_docs.py --check
      - name: Validate public profile and guide
        run: python scripts/check_profile.py
      - name: Run profile and executable-demo tests
        run: python -m unittest discover -s tests -v
